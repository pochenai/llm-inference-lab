[package]
name = "engine"
description = "LLM inference engine for tutorial purposes with cutile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
futures = "0.3"
rand = "0.9"
dashmap = "6"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
cutile.workspace = true
cuda-async.workspace = true
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
anyhow = "1"
memmap2 = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metrics = "0.24"
tracing = { version = "0.1", default-features = false, features = ["std"] }
nvtx-sys = { version = "2", default-features = false }
patricia_tree = { version = "=0.10.2", default-features = false }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
clap = { version = "4", features = ["derive"] }
libloading = "0.8.9"
tempfile = "3"

[[bench]]
name = "qwen2"
harness = false

[[bench]]
name = "qwen2_runner"
harness = false
