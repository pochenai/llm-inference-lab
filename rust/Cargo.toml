
[workspace]
resolver = "2"
members = ["cutile-tutorials", "engine"]


[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Po Chen"]
repository = "https://github.com/pochenai/llm-inference-lab"

[workspace.dependencies]
cutile = "0.4.0"
cuda-core = "0.4.0"
cuda-async = "0.4.0"
tokio = { version = "1", features = ["full"] }
